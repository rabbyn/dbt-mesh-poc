version: 2

# ─────────────────────────────────────────────────────────────────────────────
# dbt Exposures – downstream BI consumers of the Global Finance / Cost layer
# Extends end-to-end lineage from dbt models → Fabric semantic model → PBI report.
#
# Lineage tail:
#   dbt_poc_glb gold *_global  →  MetricFlow semantic models / metrics
#     →  Fabric Semantic Model  sem_cost_monitoring
#           (957d5b45-f19f-4cda-8b41-57c011a92b94)
#         →  Power BI Report     rpt_cost_monitoring   ← this exposure
#               (8d6c8fef-4622-43d0-ae69-31632c143931)
# ─────────────────────────────────────────────────────────────────────────────

exposures:

  - name: rpt_cost_monitoring
    label: "Cost Monitoring Report"
    type: dashboard
    maturity: high
    description: >
      Power BI report monitoring global cost / finance performance across the CHE
      and ITA country entities. Built on the Fabric semantic model
      sem_cost_monitoring, which is sourced from the dbt_poc_glb global gold models.

      Fabric workspace : EMEA_GDP_DBT_POC_GLB (269e9cc7-522f-4cf9-95cc-24c930c0a054)
      Report item      : rpt_cost_monitoring (8d6c8fef-4622-43d0-ae69-31632c143931)
      Semantic model   : sem_cost_monitoring (957d5b45-f19f-4cda-8b41-57c011a92b94)

    url: https://app.powerbi.com/groups/269e9cc7-522f-4cf9-95cc-24c930c0a054/reports/8d6c8fef-4622-43d0-ae69-31632c143931

    owner:
      name: Global Data Platform – Finance Domain
      email: guillaume.berthier@emea.adecco.net

    # The report consumes the global gold models that feed sem_cost_monitoring.
    depends_on:
      - ref('fct_journal_entry_global')
      - ref('dim_account_global')
      - ref('dim_cost_center_global')
