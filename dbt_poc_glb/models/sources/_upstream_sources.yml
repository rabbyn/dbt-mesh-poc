version: 2

# Fabric-compatible dbt Mesh: cross-workspace data access via Fabric Shortcuts.
# Native dbt Mesh cross-project ref() generates cross-workspace SQL that Fabric
# cannot execute. These sources route through staging lakehouses in the GLB
# workspace that hold Fabric Shortcuts pointing to the upstream ITA/CHE gold schemas.
# The project dependency is still declared in dependencies.yml for Mesh governance.

sources:
  - name: ita_gold_sales
    description: "Italy gold sales models — accessed via Fabric Shortcut in stg_lh_glb_sales"
    database: stg_lh_glb_sales
    schema: gold_ita_sales
    tables:
      - name: dim_branch
      - name: dim_client
      - name: fct_sales_order

  - name: che_gold_sales
    description: "Switzerland gold sales models — accessed via Fabric Shortcut in stg_lh_glb_sales"
    database: stg_lh_glb_sales
    schema: gold_che_sales
    tables:
      - name: dim_branch
      - name: dim_client
      - name: fct_sales_order

  - name: ita_gold_finance
    description: "Italy gold finance models — accessed via Fabric Shortcut in stg_lh_glb_finance"
    database: stg_lh_glb_finance
    schema: gold_ita_finance
    tables:
      - name: dim_account
      - name: dim_cost_center
      - name: fct_journal_entry

  - name: che_gold_finance
    description: "Switzerland gold finance models — accessed via Fabric Shortcut in stg_lh_glb_finance"
    database: stg_lh_glb_finance
    schema: gold_che_finance
    tables:
      - name: dim_account
      - name: dim_cost_center
      - name: fct_journal_entry
