version: 2

models:
  - name: dim_client
    description: "Client dimension - Switzerland"
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: client_id
        data_type: int
        data_tests: [unique, not_null]
      - name: client_name
        data_type: varchar(200)
      - name: client_type
        data_type: varchar(50)
      - name: country_code
        data_type: varchar(3)
      - name: source_country
        data_type: varchar(3)
      - name: created_at
        data_type: datetime2
      - name: _loaded_at
        data_type: datetime2

  - name: dim_branch
    description: "Branch dimension - Switzerland"
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: branch_id
        data_type: int
        data_tests: [unique, not_null]
      - name: branch_name
        data_type: varchar(200)
      - name: branch_city
        data_type: varchar(100)
      - name: branch_region
        data_type: varchar(100)
      - name: source_country
        data_type: varchar(3)
      - name: is_active
        data_type: bit
      - name: _loaded_at
        data_type: datetime2

  - name: fct_sales_order
    description: "Sales order fact table - Switzerland"
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: order_id
        data_type: int
        data_tests: [unique, not_null]
      - name: client_id
        data_type: int
        data_tests: [not_null]
      - name: branch_id
        data_type: int
        data_tests: [not_null]
      - name: order_date
        data_type: date
      - name: amount
        data_type: decimal(18,2)
      - name: currency_code
        data_type: varchar(3)
      - name: order_status
        data_type: varchar(50)
      - name: source_country
        data_type: varchar(3)
      - name: _loaded_at
        data_type: datetime2
