version: 2

models:
  - name: dim_account
    description: "Account dimension - Switzerland"
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: account_id
        description: "Unique identifier for the general ledger account (primary key)"
        data_type: int
        data_tests: [unique, not_null]
      - name: account_name
        description: "Full descriptive name of the general ledger account"
        data_type: varchar(200)
      - name: account_type
        description: "High-level classification of the account (e.g., ASSET, LIABILITY, REVENUE, EXPENSE)"
        data_type: varchar(50)
      - name: account_category
        description: "Sub-category for grouping accounts within a type (e.g., CURRENT_ASSET, OPERATING_EXPENSE)"
        data_type: varchar(50)
      - name: source_country
        description: "ISO 3166-1 alpha-3 code identifying the originating country entity (always CHE here)"
        data_type: varchar(3)
      - name: is_active
        description: "Flag indicating whether the account is currently active (1 = active, 0 = inactive)"
        data_type: bit
      - name: _loaded_at
        description: "UTC timestamp when the record was last loaded into this layer"
        data_type: datetime2

  - name: dim_cost_center
    description: "Cost center dimension - Switzerland"
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: cost_center_id
        description: "Unique identifier for the cost center (primary key)"
        data_type: int
        data_tests: [unique, not_null]
      - name: cost_center_name
        description: "Full descriptive name of the cost center"
        data_type: varchar(200)
      - name: department
        description: "Business department the cost center belongs to"
        data_type: varchar(100)
      - name: manager_name
        description: "Full name of the person responsible for the cost center"
        data_type: varchar(200)
      - name: source_country
        description: "ISO 3166-1 alpha-3 code identifying the originating country entity (always CHE here)"
        data_type: varchar(3)
      - name: is_active
        description: "Flag indicating whether the cost center is currently active (1 = active, 0 = inactive)"
        data_type: bit
      - name: _loaded_at
        description: "UTC timestamp when the record was last loaded into this layer"
        data_type: datetime2

  - name: fct_journal_entry
    description: "Journal entry fact table - Switzerland"
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: entry_id
        description: "Unique identifier for the journal entry line (primary key)"
        data_type: int
        data_tests: [unique, not_null]
      - name: account_id
        description: "Foreign key to dim_account; links the entry to a general ledger account"
        data_type: int
        data_tests: [not_null]
      - name: cost_center_id
        description: "Foreign key to dim_cost_center; links the entry to a cost center"
        data_type: int
        data_tests: [not_null]
      - name: entry_date
        description: "Business date on which the accounting entry was posted"
        data_type: date
      - name: debit_amount
        description: "Debit amount for this entry line in the transaction currency"
        data_type: decimal(18,2)
      - name: credit_amount
        description: "Credit amount for this entry line in the transaction currency"
        data_type: decimal(18,2)
      - name: currency_code
        description: "ISO 4217 three-letter currency code for the amounts (e.g., CHF, EUR, USD)"
        data_type: varchar(3)
      - name: description
        description: "Free-text narrative describing the purpose or context of the journal entry"
        data_type: varchar(500)
      - name: source_country
        description: "ISO 3166-1 alpha-3 code identifying the originating country entity (always CHE here)"
        data_type: varchar(3)
      - name: _loaded_at
        description: "UTC timestamp when the record was last loaded into this layer"
        data_type: datetime2
