version: 2

models:
  - name: dim_account
    description: "Account dimension - Italy"
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: account_id
        data_type: int
        description: "Primary key"
        data_tests: [unique, not_null]
      - name: account_name
        data_type: string
      - name: account_type
        data_type: string
      - name: account_category
        data_type: string
      - name: source_country
        data_type: string
      - name: is_active
        data_type: boolean
      - name: _loaded_at
        data_type: timestamp

  - name: dim_cost_center
    description: "Cost center dimension - Italy"
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: cost_center_id
        data_type: int
        description: "Primary key"
        data_tests: [unique, not_null]
      - name: cost_center_name
        data_type: string
      - name: department
        data_type: string
      - name: manager_name
        data_type: string
      - name: source_country
        data_type: string
      - name: is_active
        data_type: boolean
      - name: _loaded_at
        data_type: timestamp

  - name: fct_journal_entry
    description: "Journal entry fact table - Italy"
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: entry_id
        data_type: int
        description: "Primary key"
        data_tests: [unique, not_null]
      - name: account_id
        data_type: int
        data_tests: [not_null]
      - name: cost_center_id
        data_type: int
        data_tests: [not_null]
      - name: entry_date
        data_type: date
      - name: debit_amount
        data_type: decimal(18,2)
      - name: credit_amount
        data_type: decimal(18,2)
      - name: currency_code
        data_type: string
      - name: description
        data_type: string
      - name: source_country
        data_type: string
      - name: _loaded_at
        data_type: timestamp
