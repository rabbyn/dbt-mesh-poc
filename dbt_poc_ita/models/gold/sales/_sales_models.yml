version: 2

models:
  - name: dim_client
    description: "Client dimension - Italy"
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: client_id
        data_type: int
        description: "Primary key"
        data_tests: [unique, not_null]
      - name: client_name
        data_type: string
      - name: client_type
        data_type: string
      - name: country_code
        data_type: string
      - name: source_country
        data_type: string
      - name: created_at
        data_type: timestamp
      - name: _loaded_at
        data_type: timestamp

  - name: dim_branch
    description: "Branch dimension - Italy"
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: branch_id
        data_type: int
        description: "Primary key"
        data_tests: [unique, not_null]
      - name: branch_name
        data_type: string
      - name: branch_city
        data_type: string
      - name: branch_region
        data_type: string
      - name: source_country
        data_type: string
      - name: is_active
        data_type: boolean
      - name: _loaded_at
        data_type: timestamp

  - name: fct_sales_order
    description: "Sales order fact table - Italy"
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: order_id
        data_type: int
        description: "Primary key"
        data_tests: [unique, not_null]
      - name: client_id
        data_type: int
        data_tests: [not_null]
      - name: branch_id
        data_type: int
        data_tests: [not_null]
      - name: order_date
        data_type: date
      - name: amount
        data_type: decimal(18,2)
      - name: currency_code
        data_type: string
      - name: order_status
        data_type: string
      - name: source_country
        data_type: string
      - name: _loaded_at
        data_type: timestamp
